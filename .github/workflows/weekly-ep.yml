# The weekly EP.
#
# Seven tracks, one per day of the expiry window. This has to run before the
# oldest of them is deleted, which is why it is scheduled a few hours after the
# daily job rather than at some convenient hour of its own.

name: weekly ep

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      end:
        description: 'Last day of the EP window (YYYY-MM-DD).'
        required: false

concurrency:
  group: weekly-ep

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Assemble
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Through the environment, never interpolated into the script:
          # a workflow_dispatch input is untrusted text.
          END: ${{ inputs.end }}
        run: |
          if [ -n "$END" ]; then
            npm run ep -- --end "$END"
          else
            npm run ep
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ep-${{ github.run_id }}
          path: out/eps
          retention-days: 14
          if-no-files-found: error
